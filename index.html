<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beatriz Gomes — Software Engineer & UX/UI Designer</title>
  <meta name="description" content="Frontend developer and UX/UI designer. A portfolio hidden inside a dark room: click the screen to enter.">
  <meta name="theme-color" content="#060405">

  <!-- Link preview (the card shown in WhatsApp, LinkedIn, Slack, iMessage...). The image URL must be absolute. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beatriz Gomes">
  <meta property="og:title" content="Beatriz Gomes — Software Engineer &amp; UX/UI Designer">
  <meta property="og:description" content="Frontend developer and UX/UI designer. A portfolio hidden inside a dark room: click the screen to enter.">
  <meta property="og:url" content="https://beatrizvigomes.github.io/portfolio/">
  <meta property="og:image" content="https://beatrizvigomes.github.io/portfolio/images/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A dark Victorian room with a glowing computer screen, a candelabra and an armchair.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Browser-tab icon and the icon iPhones use when the page is saved to the home screen -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400&family=Inter:wght@300;400&family=VT323&display=swap" rel="stylesheet">
  <!-- The ?v= number makes phones/browsers fetch the new file instead of a saved copy. Raise it when you update the site. -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <!-- 1. The room: fills the whole screen -->
  <main class="stage" id="stage">
    <div class="world">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="fx glow-lamp"></div>
      <div class="fx glow-screen" id="glowScreen"></div>

      <button class="hotspot hs-monitor" data-open="about" data-label="click to enter" aria-label="Enter: open the portfolio"></button>
      <button class="hotspot hs-picture" data-open="offscreen" data-label="off-screen" aria-label="Open the off-screen section"></button>
      <button class="hotspot hs-music" data-open="offscreen" data-label="music &amp; films" aria-label="Open the off-screen section: music and films"></button>
    </div>

    <div class="fx vignette"></div>

    <header class="title">
      <h1>Beatriz Gomes</h1>
      <p>Software Engineer &middot; Frontend &middot; UX/UI Design</p>
    </header>

    <button class="scroll-cue" id="scrollCue" aria-label="Scroll down to the portfolio">
      <span>scroll</span><i aria-hidden="true"></i>
    </button>
  </main>

  <!-- 2. The same content you get by clicking the screen -->
  <section class="page" id="content" aria-label="Portfolio">
    <div class="panel">
      <div class="term-bar">
        <span class="prompt">beatriz@room:~$</span>
        <button class="exit" id="termExit" type="button" aria-label="Back to the room">[esc] exit</button>
      </div>
      <aside class="side">
        <div class="side-head">
          <span class="name">Beatriz Gomes</span>
          <span class="role">Engineer &amp; Designer</span>
        </div>
        <nav class="nav" id="termNav"></nav>
        <button class="back" id="toRoom">&uarr; back to the room</button>
      </aside>
      <article class="content" id="termPanel"></article>
    </div>
  </section>

  <!-- Photo viewer for the off-screen section -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
    <button class="lb-close" type="button" aria-label="Close the photo viewer">esc x</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">&lsaquo;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" type="button" aria-label="Next photo">&rsaquo;</button>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
